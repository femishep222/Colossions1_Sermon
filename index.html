<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Relationship — Colossians 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&family=Merriweather:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Two-column stage -->
  <main id="story-stage">

    <!-- Left: top scripture slot + bottom scripture slot -->
    <div id="story-left">
      <div id="scripture-top">
        <!-- top scripture injected by app.js -->
      </div>
      <div id="scripture-bottom">
        <!-- bottom scripture injected by app.js -->
      </div>
    </div>

    <!-- Right: canvas + presentation title (bottom-left) + beat nav (bottom-right) -->
    <div id="story-right">
      <canvas id="visual-canvas" aria-hidden="true"></canvas>
      <div id="right-bottom">
        <div id="presentation-title">
          <span id="sermon-title">Images of IN-dwelling</span>
          <span id="series-ref">Colossians 1:15–23</span>
        </div>
        <nav id="beat-nav" aria-label="Sermon navigation">
          <button id="nav-prev" aria-label="Previous beat" title="Previous (&#8592; &#8593;)">&#8592;</button>
          <span id="beat-counter" aria-live="polite"></span>
          <button id="nav-next" aria-label="Next beat" title="Next (&#8594; &#8595; Space)">&#8594;</button>
        </nav>
      </div>
    </div>

  </main>

  <!-- Full-page click overlay — sits above canvas, below nav -->
  <div id="story-overlay" role="button" tabindex="0" aria-label="Advance"></div>

  <script src="js/config.js"></script>
  <script src="js/beats-config.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/app.js"></script>

</body>
</html>

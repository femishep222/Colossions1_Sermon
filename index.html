<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In Relationship — Colossians 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Title bar -->
  <header id="title-bar">
    <h1 id="sermon-title">In Relationship</h1>
    <span id="series-ref">Colossians 1</span>
  </header>

  <!-- Two-column stage -->
  <main id="story-stage">

    <!-- Left: section title + scripture -->
    <div id="story-left">
      <h2 id="section-title"></h2>
      <div id="scripture-block">
        <!-- scripture items injected by app.js -->
      </div>
    </div>

    <!-- Right: canvas -->
    <div id="story-right">
      <canvas id="visual-canvas" aria-hidden="true"></canvas>
    </div>

  </main>

  <!-- Bottom bar: beat nav + attribution -->
  <footer id="bottom-bar">
    <nav id="beat-nav" aria-label="Sermon navigation">
      <button id="nav-prev" aria-label="Previous beat" title="Previous (&#8592; &#8593;)">&#8592;</button>
      <span id="beat-counter" aria-live="polite"></span>
      <button id="nav-next" aria-label="Next beat" title="Next (&#8594; &#8595; Space)">&#8594;</button>
    </nav>
    <p id="attribution">Human silhouette: Guilherme Furtado / Noun Project (CC BY 3.0)</p>
  </footer>

  <!-- Full-page click overlay — sits above canvas, below nav -->
  <div id="story-overlay" role="button" tabindex="0" aria-label="Advance"></div>

  <script src="js/beats-config.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
